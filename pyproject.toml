[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tensortrail"
version = "0.1.0"
description = "TensorTrail: an educational NumPy neural network framework built from scratch."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "TensorTrail" }]
dependencies = ["numpy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/VanshajPoonia/TensorTrail"
Documentation = "https://github.com/VanshajPoonia/TensorTrail/tree/main/docs"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
